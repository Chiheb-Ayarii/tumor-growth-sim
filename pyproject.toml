[project]
name = "tumor-growth-sim"
version = "0.1.0"
description = "Simulation de croissance tumorale (Gompertz, Fisher-KPP) — oncologie computationnelle"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "torch==2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "jupyter==1.1.1",
    "ipykernel==7.3.0",
]
mcp = [
    "mcp==2.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
